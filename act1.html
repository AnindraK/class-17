<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h2>carousel example</h2>
        <div id="mycarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#mycarousel" data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#mycarousel" data-bs-slide-to="1" class="active"></button>
                <button type="button" data-bs-target="#mycarousel" data-bs-slide-to="2" class="active"></button>
            </div>

            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="download (1).jpg" class="d-block w-100" alt="Image 1">
                </div>
                <div class="carousel-item">
                    <img src="download (2).jpg" class="d-block w-100" alt="Image 2">

                </div>
                <div class="carousel-item">
                    <img src="download.jpg" class="d-block w-100" alt="Image 3">
                
                </div>
            </div>

            <button class="carousel-control-preview" type="button" data-bs-target="#mycarousel" data-bs-slide-="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#mycarousel" data-bs-slide-="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
    </div>
</body>
</html>
